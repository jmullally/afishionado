# Weekly encrypted backup of the Supabase database (accounts, check-ins, catalog).
# Photos are not included; each user can download theirs from Me → Download my diary.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Connect → Session pooler connection string, with the DB password filled in
#   BACKUP_PASSPHRASE   any long random passphrase; keep a copy somewhere safe, it's needed to restore
#
# The repo is public, so the dump is encrypted before upload. To restore a backup:
#   gpg --decrypt afishionado-backup.tar.gz.gpg | tar xz
# then load roles.sql, schema.sql and data.sql with psql (see Supabase's "Backup and restore" docs).
name: Database backup

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets first."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only

      - name: Encrypt
        run: |
          tar czf - backup | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o afishionado-backup.tar.gz.gpg
          rm -rf backup

      - uses: actions/upload-artifact@v4
        with:
          name: afishionado-backup-${{ github.run_number }}
          path: afishionado-backup.tar.gz.gpg
          retention-days: 90
